<style>

:root{
  --b:#0056a3;--d:#003e78;--l:#e8f1fb;--t:#12263f;--m:#5b6b82;--bd:#d0dff0;
  --bg:#f0f5fb;--card:#fff;--hdr:#fff;--shadow:0 2px 12px rgba(0,62,120,.1);
  --radius:14px;--font:'Inter',system-ui,sans-serif;
  color-scheme:light
}
@media(prefers-color-scheme:dark){:root{
  --b:#4ea8e8;--d:#2d7dc7;--l:#0f1f35;--t:#e2ecf8;--m:#8ba7c7;--bd:#1e3555;
  --bg:#0a1628;--card:#0f2040;--hdr:#0d1c33;--shadow:0 2px 12px rgba(0,0,0,.4);
  color-scheme:dark
}}

*{box-sizing:border-box}
body{margin:0;font:15px/1.6 var(--font);color:var(--t);background:var(--bg);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{padding-bottom:calc(0px + env(safe-area-inset-bottom))}

/* HEADER */
header{
  position:sticky;top:0;z-index:20;background:var(--hdr);
  border-bottom:1px solid var(--bd);padding:10px 20px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  box-shadow:0 1px 0 var(--bd),var(--shadow)
}
header h1{font-size:16px;margin:0;flex:1;min-width:190px;color:var(--b);font-weight:700;letter-spacing:-.2px}
header small{display:block;font-weight:500;color:var(--m);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.lg{width:44px;height:44px;border-radius:10px;object-fit:cover}

main{max-width:1180px;margin:0 auto;padding:20px}

/* BUTTONS */
button{
  font:inherit;cursor:pointer;border-radius:9px;border:1.5px solid var(--bd);
  background:var(--card);color:var(--b);padding:8px 14px;font-weight:600;
  font-size:14px;transition:background .13s,box-shadow .13s,transform .1s;
  touch-action:manipulation;min-height:40px
}
button:hover{background:var(--l);box-shadow:0 2px 8px rgba(0,86,163,.12)}
button:active{transform:scale(.97)}
button.p{background:var(--b);color:#fff;border-color:var(--b)}
button.p:hover{background:var(--d);box-shadow:0 4px 14px rgba(0,86,163,.3)}
button.d{background:#b42318;color:#fff;border-color:#b42318}
button.d:hover{background:#8b1a12}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f5b301;outline-offset:2px}

/* TABS */
.tabs{
  display:flex;gap:6px;overflow-x:auto;margin:0 0 16px;padding:10px;
  background:linear-gradient(135deg,#0a6fc2,var(--d));border-radius:16px;
  box-shadow:0 6px 24px rgba(0,62,120,.28);scrollbar-width:none;
  position:sticky;top:calc(66px + env(safe-area-inset-top));z-index:15
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  white-space:nowrap;background:rgba(255,255,255,.12);color:#fff;
  border:1.5px solid rgba(255,255,255,.22);border-radius:10px;font-size:13px;min-height:36px;
}
.tabs button:hover{background:rgba(255,255,255,.24)}
.tabs button.on{background:#fff;color:var(--b);border-color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.22)}

/* INPUTS */
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--t)}
input,select,textarea{
  width:100%;font:inherit;padding:9px 11px;border:1.5px solid var(--bd);border-radius:8px;
  background:var(--card);color:var(--t);font-size:14px;transition:border-color .13s
}
input:focus,select:focus,textarea:focus{border-color:var(--b);outline:none;box-shadow:0 0 0 3px rgba(0,86,163,.12)}
input[type=checkbox]{width:auto;width:17px;height:17px;accent-color:var(--b)}
input[type=file]{padding:7px}
textarea{resize:vertical;min-height:80px}

/* HERO */
.hero{background:linear-gradient(135deg,var(--b),var(--d));color:#fff;position:relative;overflow:hidden}
.hin{max-width:1180px;margin:auto;padding:38px 20px;display:grid;gap:28px;grid-template-columns:1.25fr .75fr;align-items:center;position:relative;z-index:1}
@media(max-width:800px){.hin{grid-template-columns:1fr;padding:28px 16px}}
.hero h2{font-size:clamp(24px,4.5vw,42px);line-height:1.1;margin:10px 0;font-weight:800;letter-spacing:-.5px}
.hero p{opacity:.9;max-width:520px;font-size:15px;line-height:1.65}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 14px;font-size:12px;font-weight:700;letter-spacing:.03em}
.pill::before{content:'';width:8px;height:8px;border-radius:50%;background:#4ede96;box-shadow:0 0 6px #4ede96;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:440px;margin:18px 0}
.stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:12px 10px;border:1px solid rgba(255,255,255,.15)}
.stats b{font-size:24px;display:block;font-weight:800}
.stats span{font-size:11px;opacity:.8;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.hero button{border-radius:99px;font-size:14px}
.hero .w1{background:#fff;color:var(--b);font-weight:700}
.hero .w2{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.hero .w1:hover{background:#f0f7ff}
.hero .w2:hover{background:rgba(255,255,255,.12)}
.qrc{background:#fff;color:var(--t);border-radius:18px;padding:10px;text-align:center;border:2px solid rgba(255,255,255,.25);box-shadow:0 16px 48px rgba(0,0,0,.3);max-width:290px;margin:auto}
.qrc svg{width:100%;height:auto;display:block}
.qrc b{color:var(--b)}.qrc small{color:var(--m)}
.orb{position:absolute;border-radius:50%;opacity:.25;animation:fl 14s ease-in-out infinite}
.o1{width:280px;height:280px;right:-70px;top:-70px;background:radial-gradient(circle at 30% 30%,#fff,#0a6fc2)}
.o2{width:200px;height:200px;left:28%;bottom:-80px;background:radial-gradient(circle at 30% 30%,#cfe6ff,#003e78);animation-delay:-6s}
@keyframes fl{50%{transform:translateY(-28px)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}

/* SEARCH BAR */
.bar2{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.bar2 input,.bar2 select{max-width:300px;min-width:160px}

/* JOB GRID */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));perspective:900px}
.job{
  background:var(--card);border:1.5px solid var(--bd);border-radius:18px;padding:20px;
  transition:transform .15s,box-shadow .15s;
  box-shadow:var(--shadow)
}
.job:hover{box-shadow:0 16px 40px rgba(0,86,163,.18);border-color:var(--b)}
.job h3{margin:8px 0 5px;color:var(--b);font-size:17px;font-weight:700;line-height:1.3}
.m{font-size:13px;color:var(--m);line-height:1.5}
.bd{display:inline-flex;align-items:center;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}
.gF{background:#fce7f3;color:#9d174d}
.gM{background:#dbeafe;color:#1e40af}
.gB{background:#dcfce7;color:#166534}
.cd{color:#b45309;font-weight:700;font-size:13px;margin:6px 0}
.det{font-size:13px;background:var(--l);border-radius:10px;padding:10px 12px;margin:10px 0;border:1px solid var(--bd)}
.job button{flex:1}
.job>div:last-child{display:flex;gap:8px;margin-top:12px}

/* CARDS / PANELS */
.w{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:20px;margin:14px 0;overflow-x:auto;box-shadow:var(--shadow)}
.w h2,.w h3{margin:0 0 10px;color:var(--b);font-weight:700}
.w h2{font-size:20px}.w h3{font-size:16px}

/* TABLE */
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;font-size:13px;vertical-align:middle}
th{background:var(--l);font-weight:700;color:var(--b)}
tr:hover td{background:var(--l)}
.tr{cursor:pointer}

/* DIALOG */
dialog{
  border:0;border-radius:18px;padding:0;width:min(740px,97vw);max-height:92vh;
  color:var(--t);background:var(--card);box-shadow:0 24px 80px rgba(0,20,60,.35)
}
dialog::backdrop{background:rgba(0,12,35,.7);backdrop-filter:blur(4px)}
dialog>div{padding:22px;overflow-y:auto;max-height:90vh}
.act{position:sticky;bottom:0;background:var(--card);padding:12px 0 4px;border-top:1.5px solid var(--bd);margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}

/* FORM GRID */
.r2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* STATUS / ERRORS */
.er{color:#b42318;font-size:13px;margin:6px 0;font-weight:500}
.ok{color:#15803d;font-weight:600}
.mu{color:var(--m);font-size:13px}
.sub{border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.tag{font-weight:700;font-size:12px;padding:2px 8px;border-radius:99px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}

/* STATUS PIPELINE */
.st{display:flex;gap:4px;margin:10px 0}
.st i{flex:1;text-align:center;font-style:normal;font-size:11px;padding:6px 2px;border-radius:7px;background:var(--bg);font-weight:600}
.st i.on{background:var(--b);color:#fff}
.st i.no{background:#b42318;color:#fff}

/* KPI CARDS */
.kpi{
  background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:14px 16px;
  text-align:left;display:block;width:100%;transition:transform .14s,box-shadow .14s;cursor:pointer
}
.kpi:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,86,163,.18)}
.kpi b{font-size:32px;color:var(--b);display:block;line-height:1.1;font-weight:800}
.kpi span{font-size:12px;color:var(--m);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.kpi.alert{border-color:#f59e0b;background:#fffbf0}
.kpi.alert b{color:#b45309}

/* ROW BUTTON */
.rowb{display:flex;gap:10px;align-items:center;margin:4px 0;width:100%;border:0;background:transparent;padding:8px;border-radius:9px;text-align:left;min-height:0;font-size:14px}
.rowb:hover{background:var(--l)}

/* DEMO BANNER */
.demo{background:#fff8e6;color:#7a4b00;border-bottom:1.5px solid #f0d28a;padding:8px 16px;font-size:13px;text-align:center;font-weight:500;display:none}

/* ICONS */
#hb button{background:var(--card);color:var(--d);border:1.5px solid var(--bd);display:inline-flex;align-items:center;gap:7px}
#hb button.on{background:var(--b);color:#fff;border-color:var(--b)}
.ic{display:inline-flex}
.ic svg{width:18px;height:18px}
.sbl{display:none}

/* SHARE BUTTON */
.btn-share{min-height:0!important;padding:4px 10px!important;font-size:16px;line-height:1}

/* PRINT */
footer{text-align:center;color:var(--m);font-size:12px;padding:24px;border-top:1px solid var(--bd)}
#pr{display:none}
#toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--d);color:#fff;border-radius:12px;padding:11px 18px;
  z-index:50;display:none;max-width:92vw;font-size:14px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,20,60,.3);white-space:nowrap
}

/* SPINNER */
.spinner{width:48px;height:48px;border:4px solid var(--bd);border-top:4px solid var(--b);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* AVAILABILITY BADGES (already inline, this is for consistency) */

/* PRINT */
@media print{body.pg>*:not(#pr){display:none!important}body.pg #pr{display:block}.pb{page-break-after:always}}

/* RESPONSIVE MOBILE */
@media(max-width:800px){
  .hin{padding:24px 16px}
  .qrc{max-width:230px;padding:8px}
}
@media(max-width:700px){
  #toast{bottom:calc(90px + env(safe-area-inset-bottom))}
  body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  main{padding:12px}
  .hero{margin:-12px -12px 16px!important}
  header{padding:calc(6px + env(safe-area-inset-top)) 14px 6px}
  .lg{width:38px;height:38px}
  header h1{font-size:14px}
  #hb{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--hdr);
    border-top:1.5px solid var(--bd);padding:6px 8px calc(8px + env(safe-area-inset-bottom));
    display:grid!important;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;
    box-shadow:0 -6px 24px rgba(0,50,100,.14)
  }
  #hb button{
    flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;min-height:52px;
    justify-content:center;background:transparent;border:0;color:var(--m);border-radius:12px
  }
  #hb button.on{background:var(--l);color:var(--b)}
  #hb .ic svg{width:22px;height:22px}
  .lbl{display:none}.sbl{display:inline}
  .tabs{top:calc(54px + env(safe-area-inset-top))}
  input,select,textarea{font-size:16px}
  button{min-height:44px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}
  dialog>div{padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  table{min-width:520px}
  table.rt{min-width:0}
  .rt tr:first-child{display:none}
  .rt tr{display:block;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:12px;padding:6px;background:var(--card)}
  .rt td{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;padding:5px 8px}
  .rt td::before{content:attr(data-l);font-weight:700;color:var(--m);font-size:12px;min-width:80px}
  .rt td input:not([type=checkbox]),.rt td select{width:auto;max-width:58%}
  .stats{grid-template-columns:repeat(3,1fr)}
  .hero button{flex:1}
  .bar2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
  .bar2 input,.bar2 select{width:100%;max-width:100%;min-width:0;flex:1}
  .job{padding:16px;border-radius:16px}
  .job h3{font-size:17px}
}

/* Safe area header */
header{
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-left:max(20px,env(safe-area-inset-left));
  padding-right:max(20px,env(safe-area-inset-right))
}
#toast{bottom:calc(18px + env(safe-area-inset-bottom))}

#pr svg{width:100%;max-width:680px;display:block;margin:auto}
.dob{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.cal b{font-size:11px;text-align:center;color:var(--m);padding:2px 0}
.cal button{min-height:36px;padding:0;font-size:13px;border-radius:7px}
.cal button.on{background:var(--b);color:#fff;border-color:var(--b)}
.fresh{color:#15803d;font-weight:700}
.det ul{margin:4px 0 10px 18px;padding:0}.det li{margin:3px 0;line-height:1.5}
.det b{display:block;margin-top:6px;color:var(--b)}
.upw{height:8px;background:var(--l);border-radius:99px;overflow:hidden;margin:6px 0;position:relative}
.upi{position:absolute;top:0;bottom:0;width:38%;border-radius:99px;background:var(--b);animation:upm 1.3s ease-in-out infinite}
@keyframes upm{0%{left:-38%}100%{left:100%}}
.dob,.cal{max-width:440px}dialog>div{padding-bottom:0!important}dialog>div>:last-child:not(.act){margin-bottom:20px}.act{position:static!important;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
