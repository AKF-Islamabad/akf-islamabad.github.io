<style>
:root{
  --brand:#0B2E8A; --brand-2:#0B51A7; --brand-3:#1E6FD9; --gold:#C9A227;
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#0F1B3D; --muted:#5A6684; --faint:#8A94AD; --line:#E2E7F1; --soft:#EEF2FA;
  --ok:#137A3E; --ok-bg:#E4F5EA; --bad:#B42318; --bad-bg:#FDECEA; --warn:#8A5A00; --warn-bg:#FFF4D6;
  --shadow:0 1px 2px rgba(15,27,61,.06),0 8px 24px -12px rgba(15,27,61,.18); --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --brand:#7EA6FF; --brand-2:#5B8CFF; --brand-3:#8FB4FF; --bg:#0C1220; --card:#141C2E; --ink:#E7ECF7; --muted:#A3AEC6; --faint:#76819B;
  --line:#25304A; --soft:#1A2338; --ok:#62D394; --ok-bg:#13301F; --bad:#FF8C80; --bad-bg:#3A1716; --warn:#F2C661; --warn-bg:#352A10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); } }
:root[data-theme="dark"]{ --brand:#7EA6FF; --brand-2:#5B8CFF; --brand-3:#8FB4FF; --bg:#0C1220; --card:#141C2E; --ink:#E7ECF7; --muted:#A3AEC6; --faint:#76819B;
  --line:#25304A; --soft:#1A2338; --ok:#62D394; --ok-bg:#13301F; --bad:#FF8C80; --bad-bg:#3A1716; --warn:#F2C661; --warn-bg:#352A10; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); }
*{box-sizing:border-box} html,body{margin:0} body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand-2)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0B2E8A,#1E6FD9);box-shadow:0 6px 16px -6px #0B2E8A}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:0}
.grow{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px} .who b{display:block;font-size:14px} .who span{color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-weight:800;font-size:13px}
/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--brand-2);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.55;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)} .btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--bad)} .btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)} .iconbtn:hover{background:var(--soft);color:var(--ink)}
label.f{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.input,select.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:500}
.input:focus{outline:2px solid color-mix(in srgb,var(--brand-3) 45%,transparent);outline-offset:1px;border-color:var(--brand-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.notice{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600} .notice.bad{background:var(--bad-bg);color:var(--bad)} .notice.ok{background:var(--ok-bg);color:var(--ok)} .notice.info{background:var(--soft);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.brand{background:color-mix(in srgb,var(--brand-3) 16%,transparent);color:var(--brand-2)}
/* sign-in */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--brand-3) 22%,transparent),transparent),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--gold) 18%,transparent),transparent),var(--bg)}
.auth .card{width:100%;max-width:420px;padding:30px 26px;display:grid;gap:16px}
.auth h1{margin:0;font-size:24px;letter-spacing:-.02em} .auth p{margin:0;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-2);font-weight:700;cursor:pointer}
/* launcher */
.hero{padding:30px 0 8px} .hero h2{margin:0;font-size:28px;letter-spacing:-.02em} .hero p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;margin:22px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand-2);border-bottom-color:var(--brand-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-bottom:40px}
.tile{display:grid;gap:12px;padding:20px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(15,27,61,.06),0 18px 34px -16px rgba(15,27,61,.35)}
.tile .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tile h3{margin:0;font-size:17px} .tile p{margin:0;color:var(--muted);font-size:13px;min-height:38px}
.tile .foot{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--accent);opacity:.08}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* admin */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tblwrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);background:var(--soft);position:sticky;top:0}
td .sub{display:block;color:var(--muted);font-size:12px}
select.role{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;min-width:96px}
select.role.has{border-color:color-mix(in srgb,var(--brand-3) 60%,transparent);background:color-mix(in srgb,var(--brand-3) 10%,var(--card))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:640px){.grid2{grid-template-columns:1fr} .who .t{display:none}}
/* dialog + toast */
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,16,32,.55)}
.dlg-h{padding:18px 20px 0;display:flex;align-items:center;gap:10px} .dlg-h h3{margin:0;font-size:18px}
.dlg-b{padding:16px 20px;display:grid;gap:12px} .dlg-f{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.secret{font:600 18px/1.3 ui-monospace,Consolas,monospace;letter-spacing:.04em;padding:12px;border-radius:10px;background:var(--soft);text-align:center;user-select:all}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:50;width:min(460px,calc(100vw - 32px))}
.toast{padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow)} .toast.bad{background:var(--bad);color:#fff}
.muted{color:var(--muted)} .small{font-size:13px} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand-2);animation:spin 0.9s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .tile{transition:none} .spinner{animation:none} }
</style>

<body>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
"use strict";
/* ========== Alkhidmat Islamabad — main page (portal launcher + people & access) ==========
   All rules are enforced by the database (001_core.sql) and the admin-users function; this page only shows them. */
const CFG = window.AKF_SUPABASE || null;
const ROLES = ["viewer", "staff", "manager", "admin"];
const ROLE_LABEL = { viewer: "Viewer", staff: "Staff", manager: "Manager", admin: "Admin", custom: "Custom" };
const ACTIONS = ["view", "add", "edit", "delete", "approve", "export"];
const ACTION_LABEL = { view: "See", add: "Add", edit: "Edit", delete: "Delete", approve: "Approve", export: "Export" };
const AUTH_TYPE = (/[#&]type=(invite|recovery)/.exec(location.hash) || [])[1] || "";   // read before supabase-js clears the link
const S = { view: "boot", session: null, me: null, portals: [], tab: "portals", admin: null, recovery: AUTH_TYPE === "recovery" || AUTH_TYPE === "invite", busy: false, q: "", dept: "" };
let sb = null;

/* ---------- safe DOM building: text is always set as text, never parsed as HTML ---------- */
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(9)) { if (k == null || k === false) continue; e.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return e;
}
const ICONS = {
  grid: "M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z", box: "M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8",
  check: "M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9", truck: "M1 4h14v12H1zM15 8h4l3 4v4h-7M5.5 19a2 2 0 1 0 0-.1M18.5 19a2 2 0 1 0 0-.1",
  heart: "M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z", users: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",
  logout: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9", moon: "M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z", arrow: "M7 17L17 7M8 7h9v9",
  shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z", plus: "M12 5v14M5 12h14", search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3",
};
function icon(name, size = 20) {
  const ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(ns, "path"); p.setAttribute("d", ICONS[name] || ICONS.grid); s.append(p); return s;
}
const initials = n => String(n || "?").replace(/^(Dr|Mr|Ms|Mrs|Hafiz)\.?\s+/i, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const safeHref = u => /^(https:\/\/|\/(?!\/))/.test(String(u || "")) ? u : "#";
const fmt = iso => { try { return new Date(iso).toLocaleString(undefined, { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };

/* ---------- messages: plain words + a reference; details only in this browser's console ---------- */
function toast(msg, bad) { const t = el("div", { class: "toast" + (bad ? " bad" : ""), text: msg }); document.getElementById("toasts").append(t); setTimeout(() => t.remove(), bad ? 7000 : 3500); }
function fail(e, what) {
  if (e && e.userMessage) return toast(e.userMessage + (e.ref ? ` (ref ${e.ref})` : ""), true);
  const ref = Math.random().toString(36).slice(2, 8).toUpperCase(); console.error(`[ref ${ref}]`, e);
  toast(`${what || "Something went wrong"}. Reference ${ref}.`, true);
}
async function q(promise) { const r = await promise; if (r.error) throw r.error; return r.data; }
async function adminCall(body) {
  const { data } = await sb.auth.getSession();
  const res = await fetch(`${CFG.url}/functions/v1/admin-users`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (data.session && data.session.access_token), apikey: CFG.anonKey }, body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error("admin-users " + res.status); e.userMessage = j.error || "The account service did not answer. Is the admin-users function deployed?"; e.ref = j.ref; throw e; }
  return j;
}

/* ---------- start-up: refuse to run without a safe configuration ---------- */
function configError() {
  if (!CFG || !CFG.url || !CFG.anonKey || /YOUR-/i.test(CFG.url + CFG.anonKey)) return "config.js is missing or still has placeholder values.";
  if (!/^https:\/\/[^\s/]+$/i.test(CFG.url)) return "SUPABASE_URL must be the https:// project address.";
  if (/^sb_secret_/i.test(CFG.anonKey)) return "config.js contains a SECRET key. Use the anon / publishable key, and rotate the secret key now.";
  try { const p = CFG.anonKey.split(".")[1]; if (p && JSON.parse(atob(p.replace(/-/g, "+").replace(/_/g, "/"))).role === "service_role") return "config.js contains the service_role key. It must never be in a web page: use the anon key and rotate the service_role key now."; } catch (e) { return "SUPABASE_ANON_KEY is not a valid key."; }
  if (typeof supabase === "undefined") return "The sign-in library could not be loaded. Check the internet connection and reload.";
  return "";
}

async function start() {
  const err = configError();
  if (err) { S.view = "config"; S.configErr = err; return render(); }
  sb = supabase.createClient(CFG.url, CFG.anonKey);   // same address + same key = one sign-in shared by every portal
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "PASSWORD_RECOVERY") S.recovery = true;
    if (ev === "SIGNED_OUT") { S.session = null; S.me = null; S.view = "signin"; render(); }
    else if (session && (!S.session || S.session.user.id !== session.user.id)) { S.session = session; loadMe(); }
  });
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (S.session) await loadMe(); else { S.view = "signin"; render(); }
}

async function loadMe() {
  try {
    S.me = await q(sb.from("core_profiles").select("id,email,full_name,designation,dept,is_super,active,must_change_password").eq("id", S.session.user.id).maybeSingle());
    if (!S.me || !S.me.active) { S.view = "noaccess"; return render(); }
    if (S.recovery || S.me.must_change_password) { S.view = "setpw"; return render(); }
    S.portals = await q(sb.rpc("core_my_portals"));
    S.view = "home"; render();
    if (S.me.is_super && S.tab !== "portals") loadAdmin();
  } catch (e) { S.view = "error"; render(); fail(e, "Could not load your account"); }
}

async function loadAdmin() {
  try {
    const [people, modules, tabs, access, tabAccess, depts, audit, usage] = await Promise.all([
      q(sb.from("core_profiles").select("id,email,full_name,designation,dept,is_super,active,must_change_password").order("full_name")),
      q(sb.from("core_modules").select("*").order("sort")),
      q(sb.from("core_module_tabs").select("*").order("sort")),
      q(sb.from("core_module_access").select("user_id,module_key,preset")),
      q(sb.from("core_tab_access").select("user_id,module_key,tab_key,actions")),
      q(sb.from("core_departments").select("*").order("name")),
      q(sb.from("core_audit").select("at,actor_email,module,action,target").order("at", { ascending: false }).limit(200)),
      q(sb.rpc("core_usage")).catch(() => null),
    ]);
    /* acc[person][portal] = { preset, tabs: { tab: [actions] } } */
    const acc = {};
    access.forEach(a => { (acc[a.user_id] = acc[a.user_id] || {})[a.module_key] = { preset: a.preset, tabs: {} }; });
    tabAccess.forEach(t => { const x = acc[t.user_id] && acc[t.user_id][t.module_key]; if (x) x.tabs[t.tab_key] = t.actions; });
    S.admin = { people, modules, tabs, acc, depts, audit, usage }; render();
  } catch (e) { fail(e, "Could not load people and access"); }
}

/* ---------- views ---------- */
function render() {
  const app = document.getElementById("app"); app.replaceChildren();
  const v = S.view;
  if (v === "boot") return app.append(el("div", { class: "auth" }, el("div", { class: "spinner", "aria-label": "Loading" })));
  if (v === "config") return app.append(authCard("Setup needed", [el("div", { class: "notice bad", text: S.configErr }), el("p", { class: "small", text: "The page will not start until config.js is correct. See ERP-SETUP-GUIDE.md." })]));
  if (v === "signin") return app.append(signIn());
  if (v === "setpw") return app.append(setPassword());
  if (v === "noaccess") return app.append(authCard("No access yet", [el("p", { text: "Your login works, but you have no active portal account. Ask the Super Admin to add you." }), el("button", { class: "btn ghost", onclick: () => sb.auth.signOut(), text: "Sign out" })]));
  if (v === "error") return app.append(authCard("Something went wrong", [el("p", { text: "Your account could not be loaded. Check the internet connection." }), el("button", { class: "btn", onclick: () => location.reload(), text: "Try again" })]));
  app.append(topBar(), home());
}

function authCard(title, body) {
  return el("div", { class: "auth" }, el("div", { class: "card" },
    el("div", { class: "brand" }, el("div", { class: "mark" }, icon("shield", 20)), el("div", {}, "Alkhidmat Islamabad", el("small", { text: "Staff portals" }))),
    el("h1", { text: title }), body));
}

function signIn() {
  let mode = "in";
  const email = el("input", { class: "input", type: "email", autocomplete: "username", required: true, maxlength: 254 });
  const pw = el("input", { class: "input", type: "password", autocomplete: "current-password", required: true, maxlength: 128 });
  const msg = el("div");
  const btn = el("button", { class: "btn", type: "submit", text: "Sign in" });
